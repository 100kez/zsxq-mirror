{% extends 'base.html' %}
{% block title %}访问权限已到期 — 小菜鸡仓库{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card" style="max-width:440px;text-align:center">
    <div style="display:inline-flex;align-items:center;justify-content:center;
                width:64px;height:64px;border-radius:50%;margin-bottom:1rem;
                background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.1) 100%);
                border:1px solid var(--border-strong);
                color:var(--text-2);font-size:1.6rem">
      <i class="bi bi-lock"></i>
    </div>
    <h1 style="font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:.5rem">访问权限已到期</h1>
    <p style="color:var(--text-2);font-size:.92rem;margin:.5rem 0 1.75rem;line-height:1.7">
      您的体验时间已结束，开通会员或联系管理员续期。
    </p>
    <a href="{% url 'accounts:pricing' %}" class="btn btn-primary btn-full" style="margin-bottom:.625rem">
      <i class="bi bi-lightning-charge-fill"></i> 立即开通
    </a>
    <a href="{% url 'accounts:logout' %}" class="btn btn-outline btn-full">退出登录</a>
  </div>
</div>
{% endblock %}
