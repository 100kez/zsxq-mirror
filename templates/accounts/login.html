{% extends 'base.html' %}
{% block title %}登录 — 小菜鸡仓库{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="display:inline-flex;align-items:center;justify-content:center;
                  width:54px;height:54px;border-radius:14px;margin-bottom:.85rem;
                  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
                  box-shadow:0 0 24px var(--accent-glow), inset 0 0 0 1px rgba(255,255,255,.2);
                  color:#fff;font-size:1.4rem">
        <i class="bi bi-journals"></i>
      </div>
      <h1 style="font-size:1.25rem;font-weight:700;letter-spacing:-.02em;
                 background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
                 -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
        欢迎回来
      </h1>
      <p style="color:var(--text-3);font-size:.82rem;margin-top:.25rem">登录小菜鸡仓库</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.errors %}
        <div class="form-error-box">
          <i class="bi bi-exclamation-circle"></i> 用户名或密码错误，请重试。
        </div>
      {% endif %}
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-input" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <div style="margin-top:1.5rem">
        <button type="submit" class="btn btn-primary btn-full">
          <i class="bi bi-arrow-right-circle"></i> 登录
        </button>
      </div>
    </form>
    <hr class="form-divider">
    <p class="form-footer">没有账号？<a href="{% url 'accounts:register' %}">注册</a></p>
  </div>
</div>
{% endblock %}
