{% extends 'base.html' %}
{% block title %}支付完成 — 小菜鸡仓库{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card" style="max-width:480px;text-align:center">
    <div style="display:inline-flex;align-items:center;justify-content:center;
                width:68px;height:68px;border-radius:50%;margin-bottom:1rem;
                background:linear-gradient(135deg,#34d399 0%,#10b981 100%);
                box-shadow:0 0 36px rgba(52,211,153,.5), inset 0 0 0 2px rgba(255,255,255,.2);
                color:#fff;font-size:2rem;
                animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards">
      <i class="bi bi-check-lg"></i>
    </div>
    <h1 style="font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:.5rem">支付已提交</h1>
    <p style="color:var(--text-2);font-size:.92rem;margin:.5rem 0 1.75rem;line-height:1.7">
      到账可能略有延迟（一般 30 秒内）。<br>
      点击下方按钮查看最新会员状态。
    </p>
    <a href="{% url 'accounts:membership' %}" class="btn btn-primary btn-full">
      <i class="bi bi-person-badge"></i> 查看我的会员
    </a>
    <hr class="form-divider">
    <p class="form-footer">若 5 分钟后仍未到账，请联系站长。</p>
  </div>
</div>

<style>
@keyframes popIn {
  0%   { opacity:0; transform: scale(.3); }
  60%  { opacity:1; transform: scale(1.1); }
  100% { transform: scale(1); }
}
</style>
{% endblock %}
